<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2130"/>
      <stop offset="100%" stop-color="#12141d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c8cff"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- Discord crops to a circle; keep everything well inside r≈460 -->
  <text x="472" y="512" font-family="Menlo, monospace" font-size="380" font-weight="bold"
        fill="#e8eaf2" text-anchor="middle" dominant-baseline="central">wt</text>
  <!-- terminal cursor block, accent gradient -->
  <rect x="700" y="380" width="110" height="264" rx="14" fill="url(#accent)"/>
</svg>
