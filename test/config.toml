# The config `bun test` runs against, in CI and on a developer machine
# alike (see ../test/preload.ts).
#
# `core/config.ts` fail-fasts with process.exit(1) when no config file is
# present, and dozens of modules import the `config` singleton at load
# time, so the suite needs SOME config to exist. It must not be the
# machine's own: a test that reads ambient config passes for whoever
# wrote it and fails for everybody else. That cost `main` two red days —
# four `rollupChecklist` tests recognised a review-bot check only because
# the laptop running them was configured for that bot.
#
# The paths are never touched by the suite. They must still be absent, so
# a test that shells out to git in the "default" cwd fails loudly instead
# of quietly answering about a real repository.

[paths]
main_clone = "/tmp/wt-ci-fake-main"
worktree_root = "/tmp/wt-ci-fake-worktrees"
# `cache_root` is derived as this file's dirname, and log_dir/lock_dir hang
# off it, so relocating cache_db moves every cross-process artifact at once.
# Without it the suite's cache root is the REAL ~/.cache/wt, where a single
# test calling into `core/events/store.ts` would overwrite the live daemon's
# snapshot -- a test that damages the thing it is testing on a machine that
# is using it.
cache_db = "/tmp/wt-test-cache/cache.sqlite"

[branch]
prefix = "ci"
