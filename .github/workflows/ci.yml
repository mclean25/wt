name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The suite's config is checked in at test/config.toml and wired
      # through bunfig.toml's preload, so a bare `bun test` runs the same
      # here and on a developer machine. It used to be written inline
      # here instead, which meant a local run inherited the developer's
      # own config and CI inherited this one — two worlds, and the local
      # one always vouching.
      - run: bun test
