# AI-written digest of recent commits, posted to the Discord #updates channel.
#
# Debounce: every green typecheck run on main starts a run whose first step
# sleeps 30 minutes; the concurrency group cancels a sleeping run when a newer
# push goes green, so the countdown resets and one digest covers the whole
# burst. "Since when" state is the head SHA of this workflow's own last
# successful run — no tags, no files (see .github/scripts/discord-digest.ts).
#
# Gated on typecheck success (workflow_run) rather than raw pushes so the
# digest only ever describes a green tree; commits pushed while red roll into
# the next green digest. Secrets: OPENAI_API_KEY, DISCORD_UPDATES_WEBHOOK.
name: discord-digest

on:
  workflow_run:
    workflows: [typecheck]
    types: [completed]
    branches: [main]

concurrency:
  group: discord-digest
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  digest:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Debounce (a newer green push cancels this and restarts the countdown)
        run: sleep 1800
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Summarize commits and post to Discord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
        run: bun .github/scripts/discord-digest.ts
